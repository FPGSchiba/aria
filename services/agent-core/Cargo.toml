[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[features]
# Exposes the scripted backend to integration tests under tests/.
test-util = []

[dependencies]
proto                 = { workspace = true }
tonic                 = { workspace = true }
tonic-prost           = { workspace = true }
prost                 = { workspace = true }
tokio                 = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
tokio-stream          = { workspace = true }
futures-core          = { workspace = true }
tracing               = { workspace = true }
tracing-subscriber    = { workspace = true, features = ["env-filter", "fmt"] }
tracing-opentelemetry = { workspace = true }
opentelemetry         = { workspace = true }
opentelemetry_sdk     = { workspace = true }
opentelemetry-otlp    = { workspace = true }
shared                = { workspace = true }
thiserror             = { workspace = true }

[dev-dependencies]
agent-core = { path = ".", features = ["test-util"] }
tokio      = { workspace = true, features = ["test-util", "time"] }
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true
