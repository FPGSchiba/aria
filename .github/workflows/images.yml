# Container images for ARIA's core services (ARIA-123).
#
#   pull_request  -> build both images, push nothing
#   push to main  -> build both images, push to ghcr.io tagged with the full commit SHA
#
# Plan: docs/plans/2026-10-05-aria-123-ghcr-images.md. Packages are public and
# pulled anonymously (D86); the only credential is the workflow's own token.
# No `latest` tag: a moving tag conflicts with D45 and with pinned chart values.
#
# The commit is baked into each image (ARIA_GIT_SHA) so a running service reports it. On pull
# requests github.sha is the merge commit GitHub creates for the run, not a commit on the branch,
# so those builds pass the PR head SHA instead.
#
# Both targets build in one job on one builder, so the workspace compiles once
# and the second target reuses the first's builder stage.

name: images

on:
  pull_request:
  push:
    branches: [main]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: images-${{ github.ref }}
  # Superseded PR builds are cancelled. Runs on main never are: every merged SHA
  # must publish its own images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLATFORMS: linux/amd64
  CACHE_SCOPE: aria-images

jobs:
  build:
    name: build (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build aria-gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: gateway
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: ARIA_GIT_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Build aria-agent-core
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent-core
          platforms: ${{ env.PLATFORMS }}
          push: false
          build-args: ARIA_GIT_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

  publish:
    name: build and push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ghcr.io image names must be lowercase; the owner is not.
      - name: Image namespace
        id: ns
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push aria-gateway
        id: gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: gateway
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: ARIA_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ns.outputs.prefix }}/aria-gateway:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Build and push aria-agent-core
        id: agent_core
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent-core
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: ARIA_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.ns.outputs.prefix }}/aria-agent-core:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      # The digests are what D45 and the umbrella chart (ARIA-177) can pin to.
      - name: Summary
        env:
          PREFIX: ${{ steps.ns.outputs.prefix }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
          AGENT_CORE_DIGEST: ${{ steps.agent_core.outputs.digest }}
        run: |
          {
            echo "### Published images"
            echo
            echo "| Image | Tag | Digest |"
            echo "|---|---|---|"
            echo "| \`${PREFIX}/aria-gateway\` | \`${GITHUB_SHA}\` | \`${GATEWAY_DIGEST}\` |"
            echo "| \`${PREFIX}/aria-agent-core\` | \`${GITHUB_SHA}\` | \`${AGENT_CORE_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
