[package]
name = "identity"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { workspace = true }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.0", features = ["v4"] }
chrono = { version = "0.4.45" }

[dev-dependencies]
base64 = "0.22.1"
serde_json = "1.0.151"