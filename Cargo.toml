[workspace]
resolver = "2"
members = [
    "services/agent-core",
    "services/gateway",
    "services/knowledge-core",
    "services/mcp-registry",
    "services/speech",
    "crates/identity",
    "crates/shared",
    "crates/telemetry",
    "proto"
]

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[workspace.dependencies]
# --- Internal (FIXED) ---
agent-core     = { path = "services/agent-core" }
gateway        = { path = "services/gateway" }
knowledge-core = { path = "services/knowledge-core" }
mcp-registry   = { path = "services/mcp-registry" }
speech         = { path = "services/speech" }
identity       = { path = "crates/identity" }
shared         = { path = "crates/shared" }
telemetry      = { path = "crates/telemetry" }
proto          = { path = "proto" }

tonic                 = { version = "0.14.6" }
tonic-prost           = { version = "0.14.6" }
prost                 = { version = "0.14.4" }
tokio                 = { version = "1.53.1" }
tracing               = { version = "0.1.44" }
tracing-opentelemetry = { version = "0.34.0" }
tokio-stream          = { version = "0.1.19" }
futures-core          = { version = "0.3.34" }
async-stream          = { version = "0.3.6" }
tracing-subscriber    = { version = "0.3.23" }
# opentelemetry crates must track the version tracing-opentelemetry 0.33 depends on (0.32)
opentelemetry         = { version = "0.33.0" }
opentelemetry_sdk     = { version = "0.33.0" }
opentelemetry-otlp    = { version = "0.33.0", default-features = false, features = ["trace", "grpc-tonic"] }
thiserror             = { version = "2.0.20" }
tonic-reflection      = { version = "0.14.6" }
tower                 = { version = "0.5.3", features = ["retry", "util"] }
rand                  = { version = "0.9.5" }
async-openai          = { version = "0.42.1" }
reqwest               = { version = "0.13.5" }
secrecy               = { version = "0.10.3" }
humantime             = { version = "2.4.0" }
axum                  = { version = "0.8.9" }
serde_json            = { version = "1.0.151" }
